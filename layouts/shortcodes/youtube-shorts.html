<div class="latest-shorts-container">
    <div id="latestShortsContainer-{{ .Ordinal }}">Loading latest shorts...</div>
</div>

<style>
    .latest-shorts-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    .latest-shorts-container * {
        box-sizing: border-box;
    }

    .shorts-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        margin-top: 20px;
    }

    @media (min-width: 768px) {
        .shorts-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    .short-card {
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .short-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    .short-player-container {
        position: relative;
        width: 100%;
        padding-top: 177.78%;
        overflow: hidden;
        background: #000;
    }

    .short-player-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
    }

    .short-info {
        padding: 20px;
    }

    .short-title {
        font-size: 18px;
        font-weight: 600;
        color: #0f0f0f;
        margin: 0 0 8px 0;
        line-height: 1.4;
    }

    .short-date {
        font-size: 14px;
        color: #606060;
        margin: 0 0 12px 0;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .short-description {
        font-size: 14px;
        color: #404040;
        line-height: 1.6;
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .loading {
        text-align: center;
        padding: 40px;
        color: #606060;
    }

    .error {
        text-align: center;
        padding: 40px;
        color: #d32f2f;
    }

    .latest-shorts-container .hidden {
        display: none !important;
    }
</style>

<script>
    (function() {
        const SHEET_ID = '1Jagf0pqu8oGj19jFgdhXVXMyPY482GTQNq1cqKZJQag';
        const SHEET_GID = '1378999367';
        const containerId = 'latestShortsContainer-{{ .Ordinal }}';
        const MAX_SHORTS = 2;
        
        let abortController = new AbortController();
        
        async function fetchLatestShorts() {
            const container = document.getElementById(containerId);
            
            if (!container) {
                console.log('Container not found, aborting fetch');
                return;
            }
            
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}`;
                const response = await fetch(url, { 
                    signal: abortController.signal,
                    cache: 'default'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const text = await response.text();
                const json = JSON.parse(text.substr(47).slice(0, -2));
                
                if (!document.getElementById(containerId)) {
                    return;
                }
                
                const shorts = [];
                
                // Parse rows from the sheet - start from first data row
                for (let i = 0; i < json.table.rows.length && shorts.length < MAX_SHORTS; i++) {
                    const row = json.table.rows[i];
                    
                    // Column mapping based on your sheet:
                    // A (0) = Playlist
                    // B (1) = Category
                    // C (2) = Title
                    // D (3) = Date Published
                    // E (4) = Description
                    // F (5) = Video ID
                    // G (6) = Full URL
                    // H (7) = Image URL
                    
                    const title = row.c[2]?.v || '';
                    
                    // Skip empty rows
                    if (!title || title.trim() === '') {
                        continue;
                    }
                    
                    shorts.push({
                        title: title,
                        description: row.c[4]?.v || '',
                        url: row.c[6]?.v || '',
                        uploadDate: row.c[3]?.v || ''
                    });
                }
                
                displayShorts(shorts);
            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('Fetch aborted');
                    return;
                }
                
                const container = document.getElementById(containerId);
                if (container) {
                    container.innerHTML = 
                        '<div class="error">Failed to load shorts. Please try again later.</div>';
                }
                console.error('Error fetching shorts:', error);
            }
        }
        
        function displayShorts(shorts) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            container.className = 'shorts-grid';
            
            if (shorts.length === 0) {
                container.innerHTML = '<div class="error">No shorts found.</div>';
                return;
            }
            
            container.innerHTML = shorts.map(short => {
                const videoId = extractVideoId(short.url);
                return `
                    <div class="short-card">
                        <div class="short-player-container">
                            <iframe 
                                src="https://www.youtube.com/embed/${videoId}"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                allowfullscreen
                                loading="lazy">
                            </iframe>
                        </div>
                        <div class="short-info">
                            <h3 class="short-title">${escapeHtml(short.title)}</h3>
                            <div class="short-date">
                                <span>📅</span>
                                <span>${formatDate(short.uploadDate)}</span>
                            </div>
                            ${short.description ? `<p class="short-description">${escapeHtml(short.description)}</p>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function extractVideoId(url) {
            if (!url) return '';
            // Handle both youtube.com/watch?v= and youtu.be/ formats
            let match = url.match(/[?&]v=([^&]+)/);
            if (!match) {
                match = url.match(/youtu\.be\/([^?]+)/);
            }
            return match ? match[1] : '';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            
            try {
                let date;
                
                // Check if it's in DD/MM/YYYY format (your sheet format)
                if (typeof dateStr === 'string' && dateStr.includes('/')) {
                    const parts = dateStr.split('/');
                    if (parts.length === 3) {
                        const day = parseInt(parts[0]);
                        const month = parseInt(parts[1]) - 1; // JS months are 0-indexed
                        const year = parseInt(parts[2]);
                        date = new Date(year, month, day);
                    }
                } else if (typeof dateStr === 'string' && dateStr.startsWith('Date(')) {
                    // Handle Google Sheets Date() format
                    const match = dateStr.match(/Date\((\d+),(\d+),(\d+)/);
                    if (match) {
                        const year = parseInt(match[1]);
                        const month = parseInt(match[2]);
                        const day = parseInt(match[3]);
                        date = new Date(year, month, day);
                    }
                } else {
                    // Try parsing as regular date string
                    date = new Date(dateStr);
                }
                
                if (!date || isNaN(date.getTime())) return dateStr;
                
                const day = date.getDate();
                const month = date.toLocaleString('en-US', { month: 'short' });
                const year = date.getFullYear().toString().slice(-2);
                
                // Add ordinal suffix (1st, 2nd, 3rd, 4th, etc.)
                const suffix = (day) => {
                    if (day > 3 && day < 21) return 'th';
                    switch (day % 10) {
                        case 1: return 'st';
                        case 2: return 'nd';
                        case 3: return 'rd';
                        default: return 'th';
                    }
                };
                
                return `${day}${suffix(day)} ${month} '${year}`;
            } catch (e) {
                return dateStr;
            }
        }
        
        // Only fetch if we're in a browser environment and DOM is ready
        if (typeof window !== 'undefined' && document.readyState !== 'loading') {
            fetchLatestShorts();
        } else if (typeof window !== 'undefined') {
            document.addEventListener('DOMContentLoaded', fetchLatestShorts);
        }
        
        // Clean up on page unload
        window.addEventListener('beforeunload', function() {
            abortController.abort();
        });
    })();
</script>
