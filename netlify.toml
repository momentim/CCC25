[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.120.4"
  NODE_ENV = "production"
  TZ = "GMT"

[context.production.environment]
  HUGO_VERSION = "0.120.4"
  HUGO_ENV = "production"

[context.deploy-preview.environment]
  HUGO_VERSION = "0.120.4"
